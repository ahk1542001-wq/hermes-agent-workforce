name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Verify real source history, not GitHub's synthetic PR merge identity.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
        working-directory: agents/job-scout
      - name: Ruff, mypy, pytest, release boundary
        run: ./scripts/verify_all.sh
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Verify real source history, not GitHub's synthetic PR merge identity.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.4.6
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Offline Creator and Voice checks
        run: python -B scripts/verify_video.py
