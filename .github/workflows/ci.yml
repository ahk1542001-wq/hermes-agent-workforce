name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
        working-directory: agents/job-scout
      - name: Ruff, mypy, pytest, release boundary
        run: ./scripts/verify_all.sh
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
