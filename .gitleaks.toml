title = "Hermes Agent Workforce public-boundary scan"

[extend]
useDefault = true

# gitleaks-action@v2 currently resolves Gitleaks 8.24.x; the singular table
# remains backward-compatible across Gitleaks v8.
[allowlist]
description = "Exact synthetic fixtures and example domains only"
regexTarget = "line"
regexes = [
  '''https://(?:careers\.)?example\.com/''',
  '''sk-test-12345678901234567890''',
  '''abc123456789xyz''',
]
